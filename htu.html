<!DOCTYPE HTML>
<html>
<head>
		<meta charset="utf-8">
		<title>徳の木 - 使い方</title>
		<link rel="icon" href="https://files.catbox.moe/swqnzt.png">
		<link rel="stylesheet" href="style.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200..900&display=swap" rel="stylesheet">
	</head>
	<body>
		<p>
			徳の島　使い方
		</p>
		<div class="s1d">
			<input type="checkbox" id="sp01"><label for="sp01"></label>
				<div>
					<p class="sh">「徳」を送る</p>
					<p class="s">①メインメニューから「送信する」<br>
	②「内容」に徳の内容、「クラス選択」に自分のクラス、「出席番号（公開されません）」に自分の出席番号、「公開する」にこの「徳」を全員に公開するかを入力<br>
	③「送る」で送信</p>
				</div>
		</div>
		<div class="s2d">
			<input type="checkbox" id="sp02"><label for="sp02"></label>
				<div>
					<p class="sh">「徳」を見る</p>
					<p class="s">①メインメニューから「見る」<br>
	②読み込み後、「公開する」に設定された全員分の「徳」の内容が表示<br>
	③白い吹き出しの部分をクリックで非表示</p>
				</div>
		</div>
		<a href="./index.html" class="btn">ホームに戻る</a>
		<p class="c">
			Copyright © 札幌市立中の島中学校 令和7年度後期  2学年協議会
		</p>
	</body>
</html>
