		<h1>使い方</h1>
		<h2 class="faqtitle">「徳」を送る</h2>
		<h2 class="faqtext">①メインメニューから「送信する」<br>
②「内容」に徳の内容、「クラス選択」に自分のクラス、「出席番号（公開されません）」に自分の出席番号、「公開する」にこの「徳」を全員に公開するかを入力<br>
③「送る」で送信</h2>
		<h2 class="faqtitle">「徳」を見る</h2>
		<h2 class="faqtext">①メインメニューから「見る」<br>
②読み込み後、「公開する」に設定された全員分の「徳」の内容が表示<br>
③白い吹き出しの部分をクリックで非表示</h2>
